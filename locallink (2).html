<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocalLink – Small businesses, found worldwide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--pri:#C4512B;--sec:#F2B544;--ter:#2A7A74;--bg:#FFF7EA;--card:#FFFDF9;--ink:#3A2A22;--mut:#7A6455;--line:#F0DDC3;--onpri:#FFF7EA;--hd:#C4512B;--btn:#C4512B;--link:#23706A;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241813;--card:#30211A;--ink:#FBEBD8;--mut:#C2A996;--line:#503A2E;--hd:#3A1F14;--btn:#F2B544;--onpri:#2A1805;--link:#7FD0C7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241813;--card:#30211A;--ink:#FBEBD8;--mut:#C2A996;--line:#503A2E;--hd:#3A1F14;--btn:#F2B544;--onpri:#2A1805;--link:#7FD0C7;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Jost,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.15;margin:0}
a{color:var(--link)}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sec);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--hd);color:#F6F2E9;position:sticky;top:0;z-index:5;border-bottom:3px double var(--sec)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
.logo{font:700 1.7rem "Cormorant Garamond",Georgia,serif;color:#F6F2E9;text-decoration:none}.logo i{color:var(--sec)}
nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}nav a{color:#FFE9D2;text-decoration:none}nav a:hover{color:#fff}
.btn{display:inline-block;background:var(--btn);color:var(--onpri);border:0;border-radius:2px;padding:10px 20px;cursor:pointer;text-decoration:none;font-weight:500}
.btn.gold{background:var(--sec);color:#1B1408}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hero{background:radial-gradient(circle at 15% 0%,#E9803F,transparent 60%),var(--pri);color:#F6F2E9;padding:56px 0 64px;text-align:center}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);max-width:760px;margin:0 auto 12px}.hero p{max-width:560px;margin:0 auto 28px;color:#FFE9D2}
.catalog{background:var(--card);color:var(--ink);max-width:820px;margin:0 auto;padding:8px;border:1px solid var(--sec);outline:1px solid var(--sec);outline-offset:-6px;text-align:left}
.catalog form{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:0;padding:14px}
.catalog input,.catalog select{border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 8px;min-width:0}
.catalog .btn{margin-left:10px}
section{padding:48px 0}h2{font-size:2rem;margin-bottom:6px}.sub{color:var(--mut);margin:0 0 24px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);padding:18px 10px;text-align:center;cursor:pointer;color:var(--ink);text-decoration:none}
.cat:hover{border-color:var(--sec)}.cat b{display:block;font-size:1.8rem;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;color:var(--ink);text-decoration:none}
.card:hover{border-color:var(--sec)}
.mono{height:96px;display:flex;align-items:center;justify-content:center;font:600 2.4rem "Cormorant Garamond",Georgia,serif;color:#F6F2E9}
.card .in{padding:14px 16px 16px}.card h3{font-size:1.35rem}.meta{color:var(--mut);font-size:.9rem}
.card svg,.banner svg{display:block}.banner{margin:-24px -24px 18px;overflow:hidden}.star{color:var(--sec)}.badge{display:inline-block;border:1px solid var(--sec);color:var(--sec);font-size:.75rem;padding:0 6px;margin-left:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.steps div{border-top:2px solid var(--sec);padding-top:12px}.steps h3{font-size:1.3rem}
.layout{display:grid;grid-template-columns:240px 1fr;gap:28px}
.filters{display:grid;gap:12px;align-content:start;background:var(--card);border:1px solid var(--line);padding:16px}
.filters label{display:grid;gap:4px;font-size:.9rem;color:var(--mut)}.filters label.chk{display:flex;gap:8px;align-items:center}
input,select,textarea{background:var(--card);border:1px solid var(--line);padding:9px 10px;border-radius:2px;width:100%}
.prof{background:var(--card);border:1px solid var(--line);padding:24px}
.ph{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.ph .mono{width:96px;border-radius:50%;height:96px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.two ul{padding-left:18px}
form.f{display:grid;gap:12px;max-width:560px}.f label{display:grid;gap:4px;color:var(--mut);font-size:.9rem}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.plan{background:var(--card);border:1px solid var(--line);padding:22px}.plan.hot{border:2px solid var(--sec)}.plan .pr{font:600 2.2rem "Cormorant Garamond",Georgia,serif}
.plan ul{padding-left:18px;color:var(--mut)}
footer{background:var(--hd);color:#FFE9D2;padding:32px 0;margin-top:24px;border-top:3px double var(--sec);font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:#F6F2E9;padding:12px 20px;border:1px solid var(--sec);display:none;z-index:9;max-width:90vw}
@media(max-width:760px){.catalog form{grid-template-columns:1fr}.catalog .btn{margin:10px 0 0}.layout,.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.hero h1{animation:rise .8s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}}
</style>
</head>

return '<section><div class="wrap"><p><a href="#explore">← All businesses</a></p><div class="prof"><div class="banner">'+art(b,200)+'</div><div class="ph"><div><h2>'+esc(b.n)+(b.v?'<span class="badge">Verified</span>':'')+'</h2><div class="meta">'+ci(b.c)+' '+cn(b.c)+' · '+esc(b.city)+', '+esc(b.co)+'</div><div>'+stars(b)+(b.p?' · '+esc(b.p):'')+' · '+(b.o?'Open now':'Closed now')+'</div></div></div>'
+'<div class="two"><div><h3>About</h3><p>'+esc(b.d)+'</p><h3>Services</h3><ul>'+b.s.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><p><a class="btn" href="tel:'+ph+'">Call '+esc(b.t)+'</a> <a class="btn ghost" href="https://wa.me/'+ph.replace("+","")+'" rel="noopener">WhatsApp</a></p></div>'
+'<div><h3>Send an enquiry</h3><form class="f" id="enq"><label>Your name<input required></label><label>Email<input type="email" required></label><label>Message<textarea rows="3" required></textarea></label><button class="btn" type="submit">Send enquiry</button></form></div></div></div></div></section>'}
function list(){return '<section><div class="wrap"><h2>List your business</h2><p class="sub">Free to start. Tell customers who you are and how to reach you.</p><form class="f" id="lf"><label>Business name<input id="ln" required></label><label>Category<select id="lc">'+opts("other").replace('<option value="">All categories</option>','')+'</select></label><label>City<input id="lcity" required></label><label>Country<input id="lco" required></label><label>Phone or WhatsApp<input id="lp" required></label><label>Short description<textarea id="ld" rows="3" required></textarea></label><label>Services (separate with commas)<input id="ls"></label><button class="btn" type="submit">Submit listing</button></form></div></section>'}
function pricing(){return '<section><div class="wrap"><h2>Simple pricing</h2><p class="sub">Start free. Upgrade when you want more reach.</p><div class="plans">'
+'<div class="plan"><h3>Free</h3><div class="pr">$0</div><ul><li>Basic business profile</li><li>Contact buttons</li><li>Appear in search</li></ul><a class="btn ghost" href="#list">Start free</a></div>'
+'<div class="plan hot"><h3>Pro</h3><div class="pr">$9<small style="font-size:1rem"> /month</small></div><ul><li>Verified badge</li><li>Photo gallery and offers</li><li>Enquiry inbox and analytics</li></ul><a class="btn" href="#list">Choose Pro</a></div>'
+'<div class="plan"><h3>Featured</h3><div class="pr">$29<small style="font-size:1rem"> /month</small></div><ul><li>Everything in Pro</li><li>Top placement in your category</li><li>Homepage spotlight</li></ul><a class="btn ghost" href="#list">Choose Featured</a></div></div><p class="meta" style="margin-top:16px">Payments are not connected in this preview.</p></div></section>'}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3200)}
function $(i){return document.getElementById(i)}
function route(){var h=location.hash.replace("#","")||"home",a=$("app");
if(h.indexOf("biz-")==0)a.innerHTML=biz(h.slice(4));else if(h=="explore")a.innerHTML=explore();else if(h=="list")a.innerHTML=list();else if(h=="pricing")a.innerHTML=pricing();else a.innerHTML=home();
if(h!="home"||!0)window.scrollTo(0,0);wire(h)}
function wire(h){
if(h=="home"){$("hs").onsubmit=function(e){e.preventDefault();S.q=$("hq").value;S.cat=$("hc").value;S.co=$("hl").value;location.hash="explore"};
document.querySelectorAll(".cat").forEach(function(a){a.onclick=function(){S={q:"",cat:a.dataset.cat,co:"",min:0,ver:0,open:0,sort:"best"}}})}
if(h=="explore"){var up=function(){S.q=$("fq").value;S.cat=$("fc").value;S.co=$("fl").value;S.min=+$("fm").value;S.sort=$("fs").value;S.ver=$("fv").checked?1:0;S.open=$("fo").checked?1:0;var L=filt();$("res").innerHTML=resHtml(L);$("cnt").textContent=L.length};
["fq","fc","fl","fm","fs","fv","fo"].forEach(function(i){$(i).oninput=up;$(i).onchange=up});
$("fr").onclick=function(){S={q:"",cat:"",co:"",min:0,ver:0,open:0,sort:"best"};route()}}
if(h.indexOf("biz-")==0&&$("enq"))$("enq").onsubmit=function(e){e.preventDefault();e.target.reset();toast("Enquiry sent. The business will reply by email.")};
if(h=="list")$("lf").onsubmit=function(e){e.preventDefault();var b={id:D.length+1,n:$("ln").value,c:$("lc").value,city:$("lcity").value,co:$("lco").value,r:0,rv:0,v:0,o:1,d:$("ld").value,s:$("ls").value.split(",").map(function(x){return x.trim()}).filter(Boolean),p:"",t:$("lp").value};D.push(b);toast("Listing submitted. It will show a Verified badge after review.");location.hash="biz-"+b.id}}
window.addEventListener("hashchange",route);route();
</script>
<style>.cw{position:relative;display:flex}.cw .card{flex:1}.heart{position:absolute;top:8px;right:8px;background:var(--card);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1.1rem;color:var(--ter)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs .on{background:var(--btn);color:var(--onpri)}table{border-collapse:collapse;width:100%;background:var(--card)}td,th{border:1px solid var(--line);padding:10px;text-align:left}</style>
<script>
var K="ll2",X={},T="biz";
try{X=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
X.users=X.users||{};X.biz=X.biz||[];X.rev=X.rev||{};X.fav=X.fav||[];X.leads=X.leads||[];X.views=X.views||{};
function sv(){try{localStorage.setItem(K,JSON.stringify(X))}catch(e){}}
X.biz.forEach(function(b){D.push(b)});
function hs(s){var h=5381;for(var i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h}
function me(){return X.users[X.me]||null}
function eff(b){var r=X.rev[b.id]||[],t=b.r*b.rv,n=b.rv;r.forEach(function(x){t+=x.s;n++});return{r:n?t/n:0,rv:n}}
stars=function(b){var e=eff(b);return e.rv?'<span class="star">★</span> '+e.r.toFixed(1)+' <span class="meta">('+e.rv+')</span>':'<span class="meta">New listing</span>'};
function isf(i){return X.fav.indexOf(i)>=0}
card=function(b){return '<div class="cw"><a class="card" href="#biz-'+b.id+'">'+art(b,140)+'<div class="in"><h3>'+esc(b.n)+(b.v?'<span class="badge">Verified</span>':'')+'</h3><div class="meta">'+ci(b.c)+' '+cn(b.c)+' · '+esc(b.city)+', '+esc(b.co)+'</div><div>'+stars(b)+'</div></div></a><button class="heart" data-fav="'+b.id+'" aria-label="Save to favourites">'+(isf(b.id)?'♥':'♡')+'</button></div>'};
function needLogin(w){return '<section><div class="wrap"><h2>Log in to '+w+'</h2><p class="sub">Create a free owner account or log in.</p><p><a class="btn" href="#login">Log in or sign up</a></p></div></section>'}
function loginP(){return '<section><div class="wrap"><h2>Owner account</h2><p class="sub">Accounts in this preview are stored only in this browser.</p><div class="plans"><form class="f plan" id="lg"><h3>Log in</h3><label>Email<input type="email" required></label><label>Password<input type="password" required></label><button class="btn" type="submit">Log in</button></form><form class="f plan" id="su"><h3>Create account</h3><label>Your name<input required></label><label>Email<input type="email" required></label><label>Password (6+ characters)<input type="password" minlength="6" required></label><button class="btn" type="submit">Create account</button></form></div></div></section>'}
function saved(){var L=D.filter(function(b){return isf(b.id)});return '<section><div class="wrap"><h2>Saved businesses</h2><p class="sub">Tap the heart on any listing to keep it here.</p>'+(L.length?'<div class="grid">'+L.map(card).join('')+'</div>':'<p>You haven’t saved any businesses yet. <a href="#explore">Explore listings</a>.</p>')+'</div></section>'}
function dash(){var u=me();if(!u)return needLogin("open your dashboard");
var mine=D.filter(function(b){return b.owner==X.me}),ids=mine.map(function(b){return b.id}),h='',tabs=[["biz","My listings"],["inbox","Enquiries"],["rev","Reviews"],["stats","Analytics"]];
if(T=="biz")h=mine.length?mine.map(function(b){return '<div class="prof" style="margin-bottom:16px"><h3>'+esc(b.n)+'</h3><form class="f" data-save="'+b.id+'"><label>Description<textarea rows="3">'+esc(b.d)+'</textarea></label><label>Phone<input value="'+esc(b.t)+'"></label><label>Services (comma separated)<input value="'+esc(b.s.join(", "))+'"></label><div><button class="btn" type="submit">Save changes</button> <a class="btn ghost" href="#biz-'+b.id+'">View page</a></div></form></div>'}).join(''):'<p>You have no listings yet. <a href="#list">List your business</a> to start receiving enquiries.</p>';
if(T=="inbox"){var L=X.leads.filter(function(l){return ids.indexOf(l.b)>=0});h=L.length?L.map(function(l){var b=D.filter(function(x){return x.id==l.b})[0];return '<div class="prof" style="margin-bottom:12px"><b>'+esc(l.n)+'</b> · <a href="mailto:'+esc(l.e)+'">'+esc(l.e)+'</a> <span class="meta">'+l.d+' · '+esc(b.n)+'</span><p>'+esc(l.m)+'</p></div>'}).join(''):'<p>No enquiries yet. They appear here when customers use the enquiry form on your page.</p>'}
if(T=="rev"){h=mine.map(function(b){var r=X.rev[b.id]||[];return '<div class="prof" style="margin-bottom:16px"><h3>'+esc(b.n)+'</h3>'+(r.length?r.map(function(x,i){return '<div style="border-top:1px solid var(--line);padding:10px 0"><span class="star">'+'★'.repeat(x.s)+'</span> <b>'+esc(x.n)+'</b><p style="margin:4px 0">'+esc(x.t)+'</p>'+(x.re?'<p class="meta">Your reply: '+esc(x.re)+'</p>':'<form class="f" data-rep="'+b.id+':'+i+'"><input placeholder="Write a public reply" required><button class="btn" type="submit">Reply</button></form>')+'</div>'}).join(''):'<p class="meta">No reviews yet.</p>')+'</div>'}).join('')||'<p>List a business to receive reviews.</p>'}
if(T=="stats")h=mine.length?'<table><tr><th>Listing</th><th>Page views</th><th>Enquiries</th><th>Reviews</th><th>Rating</th></tr>'+mine.map(function(b){var e=eff(b);return '<tr><td>'+esc(b.n)+'</td><td>'+(X.views[b.id]||0)+'</td><td>'+X.leads.filter(function(l){return l.b==b.id}).length+'</td><td>'+e.rv+'</td><td>'+(e.rv?e.r.toFixed(1):"–")+'</td></tr>'}).join('')+'</table>':'<p>Analytics appear once you have a listing.</p>';
return '<section><div class="wrap"><h2>Welcome, '+esc(u.name)+'</h2><p class="sub">Manage your listings, enquiries and reviews. <button class="btn ghost" data-out="1">Log out</button></p><div class="tabs">'+tabs.map(function(t){return '<button class="btn ghost'+(T==t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+(t[0]=="inbox"?' ('+X.leads.filter(function(l){return ids.indexOf(l.b)>=0}).length+')':'')+'</button>'}).join('')+'</div>'+h+'</div></section>'}
function nav(){var u=me();document.querySelector("nav").innerHTML='<a href="#explore">Explore</a><a href="#saved">Saved ('+X.fav.length+')</a><a href="#pricing">Pricing</a>'+(u?'<a href="#dashboard">Dashboard</a>':'<a href="#login">Log in</a>')+'<a class="btn gold" href="#list">List your business</a>'}
var route0=route,wire0=wire,biz0=biz,list0=list;
list=function(){return me()?list0():needLogin("list your business")};
biz=function(id){var h=biz0(id),b=D.filter(function(x){return x.id==id})[0];if(!b)return h;X.views[id]=(X.views[id]||0)+1;sv();var u=me(),rv=X.rev[id]||[];
var add='<div class="prof" style="margin-top:18px"><p><button class="btn ghost" data-fav="'+id+'">'+(isf(b.id)?'♥ Saved':'♡ Save to favourites')+'</button></p><h3>Reviews</h3>'+(rv.length?rv.map(function(r){return '<div style="border-top:1px solid var(--line);padding:10px 0"><span class="star">'+'★'.repeat(r.s)+'</span> <b>'+esc(r.n)+'</b> <span class="meta">'+r.d+'</span><p style="margin:4px 0">'+esc(r.t)+'</p>'+(r.re?'<p class="meta" style="margin:0 0 0 16px">Owner reply: '+esc(r.re)+'</p>':'')+'</div>'}).join(''):'<p class="meta">No reviews yet. Be the first to share your experience.</p>')+'<form class="f" id="rf"><label>Your rating<select id="rs"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>Your name<input id="rn" required value="'+(u?esc(u.name):'')+'"></label><label>Your review<textarea id="rt" rows="3" required></textarea></label><button class="btn" type="submit">Post review</button></form></div>';
var k='</div></section>';return h.slice(0,h.length-k.length)+add+k};
wire=function(h){if(h=="home"||h=="explore")wire0(h)};
route=function(){var h=location.hash.replace("#",""),P={login:loginP,dashboard:dash,saved:saved};if(P[h]){$("app").innerHTML=P[h]();window.scrollTo(0,0)}else route0();nav()};
window.removeEventListener("hashchange",route0);window.addEventListener("hashchange",function(){route()});
document.addEventListener("click",function(e){var f=e.target.closest("[data-fav]"),t=e.target.closest("[data-tab]"),o=e.target.closest("[data-out]");
if(f){var i=+f.dataset.fav,k=X.fav.indexOf(i);k<0?X.fav.push(i):X.fav.splice(k,1);sv();var on=k<0;f.textContent=f.classList.contains("heart")?(on?"♥":"♡"):(on?"♥ Saved":"♡ Save to favourites");nav();if(location.hash=="#saved")route()}
if(t){T=t.dataset.tab;route()}
if(o){X.me=null;sv();location.hash="home";route()}});
document.addEventListener("submit",function(e){var f=e.target,id=f.id,el=f.elements,today=new Date().toISOString().slice(0,10);
if(id=="hs")return;e.preventDefault();
if(id=="su"){var em=el[1].value.trim().toLowerCase();if(X.users[em])return toast("That email already has an account. Log in instead.");X.users[em]={name:el[0].value.trim(),h:hs(el[2].value)};X.me=em;sv();toast("Account created. Welcome!");location.hash="dashboard";route()}
if(id=="lg"){var e2=el[0].value.trim().toLowerCase(),u=X.users[e2];if(!u||u.h!=hs(el[1].value))return toast("Email or password is incorrect.");X.me=e2;sv();toast("Logged in.");location.hash="dashboard";route()}
if(id=="enq"){var bid=+location.hash.replace("#biz-","");X.leads.unshift({b:bid,n:el[0].value,e:el[1].value,m:el[2].value,d:today});sv();f.reset();toast("Enquiry sent. The business will see it in their inbox.")}
if(id=="rf"){var rb=+location.hash.replace("#biz-","");(X.rev[rb]=X.rev[rb]||[]).unshift({s:+$("rs").value,n:$("rn").value,t:$("rt").value,d:today});sv();toast("Review posted. Thank you!");route()}
if(id=="lf"){var b={id:D.length+1,n:$("ln").value,c:$("lc").value,city:$("lcity").value,co:$("lco").value,r:0,rv:0,v:0,o:1,d:$("ld").value,s:$("ls").value.split(",").map(function(x){return x.trim()}).filter(Boolean),p:"",t:$("lp").value,owner:X.me};D.push(b);X.biz.push(b);sv();toast("Listing published. Manage it from your dashboard.");location.hash="biz-"+b.id}
if(f.dataset.save){var sb=D.filter(function(x){return x.id==f.dataset.save})[0];sb.d=el[0].value;sb.t=el[1].value;sb.s=el[2].value.split(",").map(function(x){return x.trim()}).filter(Boolean);sv();toast("Changes saved.")}
if(f.dataset.rep){var p=f.dataset.rep.split(":");X.rev[p[0]][+p[1]].re=el[0].value;sv();toast("Reply posted.");route()}});
route();
</script>
